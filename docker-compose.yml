services:
  calendar:
    build: .
    container_name: calendar_app
    ports:
      - "50051:50051"
    volumes:
      - .:/app        # Optional: Live code updates
    env_file:
      - path: .env
        required: false
    environment:
      FLARESOLVERR_URL: http://flaresolverr:8191/v1
    depends_on:
      - flaresolverr

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    container_name: flaresolverr
    ports:
      - "8191:8191"
