syntax = "proto3";

package home_calendar.hltv;

import "google/protobuf/empty.proto";

option java_multiple_files = true;
option java_package = "com.example.homecalendar.hltv";
option java_outer_classname = "HltvProto";

// ---- Team ----
message HltvTeam {
  int32 rank = 1;
  string name = 2;
  string logo_url = 3;
  int32 team_id = 4;
  string team_id_name = 5;
}

// ---- Stream ----
// Adjust these fields to match your real HltvStream model if needed.
message HltvStream {
  string name = 1;
  string url = 2;
  string language = 3;
}

// ---- Match ----

message HltvMatch {
  string event_name = 1;
  string event_url = 2;
  int64 match_id = 3;
  string match_url = 4;

  // ISO-8601 datetime string, e.g. "2025-11-04T09:25:00"
  string datetime = 5;

  string team1 = 6;
  string team2 = 7;

  int32 score1 = 8;
  int32 score2 = 9;

  int32 best_of = 10;

  repeated HltvStream streams = 11;
}

// ---- Requests / Responses ----

message SyncMatchesRequest {
  int32 team_id = 1;
  string slug = 2;
}

message SyncTeamsResponse {
  repeated HltvTeam teams = 1;
}

message SyncMatchesResponse {
  repeated HltvMatch matches = 1;
}

// ---- Service ----

service HltvService {
  rpc SyncTeams(google.protobuf.Empty) returns (SyncTeamsResponse);
  rpc SyncMatches(SyncMatchesRequest) returns (SyncMatchesResponse);
}
